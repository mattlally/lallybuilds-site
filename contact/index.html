<main class="page">
  <h1>Let’s build something together</h1>
  <p class="lede">Brand partnerships, a project, or just saying hi.</p>
  <!-- Web3Forms: submissions are emailed to Matt. The access key is public by design. -->
  <form class="form" name="contact" action="https://api.web3forms.com/submit" method="POST" data-contact>
    <input type="hidden" name="access_key" value="854f95d6-2d4c-4b5d-9d70-3945bfc2408c">
    <input type="hidden" name="subject" value="New message from lallybuilds.com">
    <input type="hidden" name="from_name" value="lallybuilds.com">
    <input type="hidden" name="redirect" value="https://lallybuilds.com/contact/thanks/">
    <input type="checkbox" name="botcheck" class="hidden" style="display:none" tabindex="-1" autocomplete="off">
    <div class="row2">
      <div class="field"><label for="name">Your name</label><input id="name" name="name" autocomplete="name" required></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
    </div>
    <div class="row2">
      <div class="field"><label for="about">What’s this about?</label>
        <select id="about" name="about" required>
          <option value="" disabled selected>Choose one</option>
          <option>Brand partnership</option>
          <option>Building something together</option>
          <option>Just saying hi</option>
        </select></div>
      <div class="field"><label for="link">Company or website <span>(optional)</span></label><input id="link" name="link" autocomplete="url"></div>
    </div>
    <div class="field"><label for="msg">What do you have in mind?</label><textarea id="msg" name="message" required></textarea></div>
    <button class="btn" type="submit">Send</button>
    <p class="status" role="status" aria-live="polite"></p>
  </form>
</main>
